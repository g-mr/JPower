#通用配置
server:
  port: 9999
  undertow:
    # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
    threads:
      io: 4
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 20
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作
    buffer-size: 1024
    # 是否分配的直接内存
    direct-buffers: true

spring:
  data:
    redis:
      ##redis 单机环境配置
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:123456}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      ##redis 集群环境配置
    #    cluster:
    #      nodes:
    #        - 127.0.0.1:6379
    #        - 127.0.0.1:6378
    #        - 127.0.0.1:6377
    #      commandTimeout: 5000
  #通用配置
  mvc:
    async:
      # SSE流式响应需要无限超时
      request-timeout: -1
  servlet:
    multipart:
      enabled: true
      #单个数据的大小
      max-file-size: 10MB
      #总数据的大小
      max-request-size: 20MB
  cloud:
    openfeign:
      okhttp:
        enabled: true
    sentinel:
      enabled: false
      eager: true
      log:
        dir: ./logs/sentinel
    nacos: # 单机版本关闭nacos 服务发现和配置管理的能力
      config:
        enabled: false
      discovery:
        enabled: false
  security:
    user:
      name: "admin"
      password: "admin"
  ai:
    dashscope: # 通义千问
      api-key: ${DASHSCOPE_API_KEY:}
#      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: ${DEEPSEEK_MODEL:qwen3.5-plus}
          multiModel: true
#      sdk:
#        api-key: xxxxxxxxxxxxxxxxxxxxxx
##        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
#        chat:
#          completions-path: /api/v1/services/aigc/multimodal-generation/generation
#          options:
#            model: qwen3.5-plus
#            multiModel: true
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-r1-distill-qwen-32b}



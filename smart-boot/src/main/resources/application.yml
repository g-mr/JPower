mybatis-flex:
  datasource:
    master:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${DB_MASTER_ADDRESS:127.0.0.1:3306}/${DB_MASTER_NAME:smartaster}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      username: ${DB_MASTER_USERNAME:root}
      password: ${DB_MASTER_PASSWORD:12345678}
      # 下面为连接池的补充设置
      druid:
        initialSize: 10   #初始化连接个数
        minIdle: 10       #最小空闲连接个数
        maxActive: 100    #最大连接个数
        maxWait: 60000    #获取连接时最大等待时间，单位毫秒。
        timeBetweenEvictionRunsMillis: 60000  #配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        minEvictableIdleTimeMillis: 30000     #配置一个连接在池中最小生存的时间，单位是毫秒
        validationQuery: select 'x' #用来检测连接是否有效的sql，要求是一个查询语句。
        testWhileIdle: true       #建议配置为true，不影响性能，并且保证安全性。如果空闲时间大于timeBetweenEvictionRunsMillis，执行validationQuery检测连接是否有效。
        testOnBorrow: true        #申请连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能
        testOnReturn: false       #归还连接时执行validationQuery检测连接是否有效，做了这个配置会降低性能
        poolPreparedStatements: false #是否缓存preparedStatement，也就是PSCache。PSCache对支持游标的数据库性能提升巨大，比如说oracle。在mysql下建议关闭。
        maxPoolPreparedStatementPerConnectionSize: -1 #要启用PSCache，必须配置大于0，当大于0时，poolPreparedStatements自动触发修改为true。在Druid中，不会存在Oracle下PSCache占用内存过多的问题，可以把这个数值配置大一些，比如说100
        filters: stat,wall,slf4j #通过别名的方式配置扩展插件，常用的插件有：监控统计用的filter:stat，日志用的filter:log4j，防御sql注入的filter:wall
        connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000 # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
        useGlobalDataSourceStat: true # 合并多个DruidDataSource的监控数据
    asterisk:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${DB_ASTERISK_ADDRESS:127.0.0.1:3306}/${DB_ASTERISK_NAME:smartaster_asterisk}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
      username: ${DB_ASTERISK_USERNAME:root}
      password: ${DB_ASTERISK_PASSWORD:12345678}
  type-aliases-super-type: top.jpower.core.dbs.dbs.entity.base.BaseEntity
  mapper-locations: classpath*:com/qidiangk/smart/**/dbs/dao/mapper/**/*Mapper.xml


asterisk:
  transport: transport-udp
  ami:
    host: ${ASTERISK_AMI_HOST:127.0.0.1}
    port: ${ASTERISK_AMI_PORT:5038}
    username: ${ASTERISK_AMI_USERNAME:admin}
    password: ${ASTERISK_AMI_PASSWORD:a1b2c3}
    event: true
  agi:
    port: ${ASTERISK_AGI_PORT:4573}
  voice-root-dir: /data/
  context:
    out: outbound-dialer # 呼出上下文名称
    in: inbound-dialer # 呼入上下文名称
    exten: robot

# 这里的配置是默认值，在IVR流程中配置的话会覆盖这里的配置
ivr:
  ali:
    accessKeyId: ${IVR_ALI_KEY_ID:}
    accessKeySecret: ${IVR_ALI_KEY_SECRET:}
    app-key: ${IVR_ALI_APP_KEY:}
    tts-option:
      voice: siyue
      format: wav
      sample-rate: sample_rate_8k
      volume: 50
      pitch-rate: 0
      speech-rate: 0
      min-send-interval-ms: 100
    asr-option:
      format: wav
      sample-rate: sample_rate_8k
      max-sentence-silence: 800
      enable-intermediate-result: true
    asr-file-role:
      region-id: cn-beijing
      version: 2018-08-17
      auto-split: true
      supervise-type: 1
      speaker-num: 2
      enable-inverse-text-normalization: true
      enable-disfluency: true
      enable-semantic-sentence-detection: true
      file-dir: /data/download/
      file-domain: https://xxxxxxxxxxxxxxxxx/ivr-api/maxkb/dataset/transferFile/
  # 这里的配置是默认值，在IVR流程中配置的话会覆盖这里的配置
  # dashscope 配置，默认 DashScope ASR 引擎
  dashscope:
    # DashScope API Key
    api-key: ${IVR_DASHSCOPE_API_KEY:${spring.ai.dashscope.api-key}}
    # 自定义 WebSocket 地址（内网私有化部署时配置，留空使用官方地址）
    # websocket-url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
    asr-option:
      # 模型
      model: qwen3-asr-flash-realtime
      # 音频格式：pcm（默认）/ wav
      format: wav
      # 采样率：8000（电话场景）
      sample-rate: 8000
      # VAD 断句静音时长（ms），200~6000，默认 800
      max-end-silence: 800
      # 音频源语言
      language: zh
      # VAD 噪音阈值
      turn-detection-threshold: 0.8
      ################################# 以下只有qwen类型模型生效
      # 是否开启服务端 VAD 断句
      enable-turn-detection: true
      # 上下文文本/热词偏置，最大 10000 tokens
      # corpus-text: ""
      ################################# 以下只有fun类型模型生效
      # 是否开启语义标点（根据语义自动断句加标点, 设置为true以后将不根据VAD来判断断句）
      semantic-punctuation-enabled: false
      # 自定义热词表 ID（对应 SDK 字段 phraseId），在 DashScope 控制台创建热词表后填入
      # phrase-id: phrasexxx
    tts-option:
      # TTS 模型：CosyVoice 系列（cosyvoice-v3-flash 推荐）/ Qwen-TTS 系列（qwen3-tts-flash-realtime）
      model: qwen3-tts-flash-realtime
      # 音色：CosyVoice 常用 longanyang / longxiaochun；Qwen-TTS 常用 Cherry / Ethan
#      voice: Cherry
      # 采样率：8000（电话场景）/ 24000（Qwen-TTS 默认）
      sample-rate: 8000
      # 音量 [0, 100]，默认 50
      volume: 50
      # 语速 [0.5, 2.0]，默认 1.0
      speech-rate: 1.0
      # 语调 [0.5, 2.0]，默认 1.0
      pitch-rate: 1.0
  dianxin:
    asr-url: wss://openapi.teleagi.cn:443/aipaas/voice/v1/asr/fy
    tts-url: wss://openapi.teleagi.cn:443/aipaas/voice/v1/tts/supernaturalrt
    appId: ${IVR_DIANXIN_APP_ID:}
    appKey: ${IVR_DIANXIN_APP_KEY:}
    tts-option:
      voice: kefunv2
      sample-rate: 8000
    asr-option:
      sample-rate: 8000
      enable-punctuation: true
      enable-inverse-text-normalization: false
      enable-emendation: true
      max-end-silence: 600

retrofit:
  global-converter-factories:
    - com.qidiangk.smart.maxkb.config.retrofit.BodyCodeConverterFactory
    - com.github.lianjiatech.retrofit.spring.boot.core.BasicTypeConverterFactory
    - retrofit2.converter.jackson.JacksonConverterFactory
  # 自动设置PathMathInterceptor的scope为prototype
  auto-set-prototype-scope-for-path-math-interceptor: true
  global-retry:
    # 是否启用全局重试
    enable: true
    # 全局重试间隔时间
    interval-ms: 100
    # 全局最大重试次数
    max-retries: 2
    # 全局重试规则
    retry-rules:
      - response_status_not_2xx
      - occur_io_exception
  # 全局日志打印配置
#  global-log:
#    # 启用日志打印
#    enable: true
#    # 全局日志打印级别
#    log-level: info
#    # 全局日志打印策略
#    log-strategy: BODY
#    # 是否聚合打印请求日志
#    aggregate: true


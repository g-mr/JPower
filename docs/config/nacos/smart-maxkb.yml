retrofit:
  global-converter-factories:
    - com.qidiangk.smart.maxkb.config.retrofit.BodyCodeConverterFactory
    - com.github.lianjiatech.retrofit.spring.boot.core.BasicTypeConverterFactory
    - retrofit2.converter.jackson.JacksonConverterFactory
  # 自动设置PathMathInterceptor的scope为prototype
  auto-set-prototype-scope-for-path-math-interceptor: true
  global-retry:
    # 是否启用全局重试
    enable: true
    # 全局重试间隔时间
    interval-ms: 100
    # 全局最大重试次数
    max-retries: 2
    # 全局重试规则
    retry-rules:
      - response_status_not_2xx
      - occur_io_exception
  # 全局日志打印配置
#  global-log:
#    # 启用日志打印
#    enable: true
#    # 全局日志打印级别
#    log-level: info
#    # 全局日志打印策略
#    log-strategy: BODY
#    # 是否聚合打印请求日志
#    aggregate: true

maxkb:
  # 登录账号
  username: admin
  # 登录密码
  password: MaxKB@123...
  # 内网访问地址
  baseUrl: http://127.0.0.1:8080/
  # 外网访问地址

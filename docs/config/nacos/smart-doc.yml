knife4j:
  enableAggregation: true
  cloud:
    enable: true
    routes:
      - name: 授权模块
        uri: host.docker.internal:9000
        location: /smart-auth/v3/api-docs
      - name: 系统管理
        uri: host.docker.internal:9000
        location: /smart-system/v3/api-docs
      - name: 用户模块
        uri: host.docker.internal:9000
        location: /smart-user/v3/api-docs
      - name: 文件模块
        uri: host.docker.internal:9000
        location: /smart-file/v3/api-docs
      - name: 日志模块
        uri: host.docker.internal:9000
        location: /smart-log/v3/api-docs
      - name: 呼叫中心
        uri: host.docker.internal:9000
        location: /smart-aster/v3/api-docs
      - name: MaxKB模块
        uri: host.docker.internal:9000
        location: /smart-maxkb/v3/api-docs
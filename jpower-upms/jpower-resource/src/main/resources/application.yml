server:
  port: 9004

spring:
  config:
    import:
      - optional:nacos:jpower.yml
      - optional:nacos:jpower-dev.yml
      - optional:nacos:jpower-resource.yml
      - optional:nacos:jpower-resource-dev.yml
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      config:
        import-check:
          enabled: false   # 默认为 false，设为 true 后，缺失的配置会导致启动失败


fdfs:
  # 链接超时
  connect-timeout: 1800
  # 读取时间
  so-timeout: 1800
  # 生成缩略图参数
  thumb-image:
    width: 150
    height: 150
  tracker-list:
    - 127.0.0.1:22122
server:
  port: 8868

spring:
  config:
    import:
      - nacos:jpower.yml
      - nacos:jpower-dev.yml
      - nacos:jpower-admin.yml
      - nacos:jpower-admin-dev.yml
  # 覆盖 jpower.yml 中的配置，Admin UI 需要静态资源映射
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false   # 默认为 false，设为 true 后，缺失的配置会导致启动失败
  boot:
    admin:
      discovery:
        # 启用服务发现，从 Nacos 自动发现客户端
        enabled: true
        # 忽略 Admin 自身服务，避免自我监控干扰
        ignored-services:
          - jpower-admin
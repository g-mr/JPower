server:
  port: 8868
  undertow:
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 4
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 20
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    buffer-size: 1024
    # 是否分配的直接内存
    direct-buffers: true

spring:
  config:
    import:
      - nacos:jpower.yml
      - nacos:jpower-dev.yml
      - nacos:jpower-admin.yml
  # 覆盖 jpower.yml 中的配置，Admin UI 需要静态资源映射
  mvc:
    throw-exception-if-no-handler-found: false
  web:
    resources:
      add-mappings: true
  security:
    user:
      name: "admin"
      password: "admin"
  cloud:
    nacos:
      server-addr: 8.130.172.218:8848
      config:
        import-check:
          enabled: false   # 默认为 false，设为 true 后，缺失的配置会导致启动失败
      discovery:
        # 将本服务实例注册到服务中心时，在元信息中携带访问本服务使用的用户名和密码
        metadata:
          user.name: ${spring.security.user.name}
          user.password: ${spring.security.user.password}
  boot:
    admin:
      discovery:
        # 启用服务发现，从 Nacos 自动发现客户端
        enabled: true
        converter:
          # 使用 Nacos 元数据中的 management-port 作为管理端口
          management-context-path: /actuator
      # 使用 Nacos 元数据中的用户名密码访问客户端 Actuator 端点
      instance-auth:
        default-user-name: ${spring.security.user.name}
        default-password: ${spring.security.user.password}